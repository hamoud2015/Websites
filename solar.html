<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاكاة التفاعلية للنظام الشمسي - Solar System Interactive Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.15);
            --accent-blue: #38bdf8;
            --accent-gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            background-color: #030712;
            color: #ffffff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* HTML Overlay Containers */
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Top Header Bar */
        #top-bar {
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .title-badge {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f3f4f6;
        }

        .title-badge small {
            display: block;
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-weight: 400;
        }

        /* Floating 3D Labels */
        #labels-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .planet-label {
            position: absolute;
            transform: translate(-50%, -100%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            color: #e0f2fe;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: opacity 0.2s ease;
        }

        /* Sidebar - View Modes */
        #sidebar {
            top: 80px;
            left: 20px;
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-header {
            font-size: 0.85rem;
            color: #9ca3af;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2px;
        }

        .mode-btn {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 10px 14px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: right;
        }

        .mode-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent-blue);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.5);
        }

        .mode-btn .btn-text strong {
            display: block;
            font-size: 0.9rem;
        }

        .mode-btn .btn-text span {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        /* Bottom Controls Bar */
        #bottom-bar {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .control-group {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .ctrl-btn.active {
            background: var(--accent-blue);
        }
    </style>
    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="labels-container"></div>

    <!-- Top Stats & Header -->
    <div id="top-bar" class="ui-layer">
        <div class="badge-card interactive">
            <div>🌍 فصل الأرض: <strong id="season-val" style="color: #4ade80;">الصيف (Summer)</strong></div>
            <div>|</div>
            <div>📅 اليوم <strong id="day-val">1</strong> - السنة <strong id="year-val">1</strong></div>
        </div>

        <div class="badge-card interactive">
            <div class="title-badge">
                المحاكاة التفاعلية للنظام الشمسي
                <small>Solar System Interactive Simulation</small>
            </div>
            ⚙️
        </div>
    </div>

    <!-- Right Sidebar Menu -->
    <div id="sidebar" class="ui-layer">
        <div class="sidebar-header">أوضاع العرض (VIEW MODES)</div>
        
        <button class="mode-btn active interactive" onclick="setMode('overview', this)">
            <div class="btn-text">
                <strong>النظام الشمسي (Overview)</strong>
                <span>رؤية شاملة للثمانية كواكب</span>
            </div>
            🌐
        </button>

        <button class="mode-btn interactive" onclick="setMode('earth', this)">
            <div class="btn-text">
                <strong>دراسة الأرض (Earth Focus)</strong>
                <span>الدوران والميل المحوري والقمر</span>
            </div>
            🌎
        </button>

        <button class="mode-btn interactive" onclick="setMode('daynight', this)">
            <div class="btn-text">
                <strong>الليل والنهار (Day & Night)</strong>
                <span>دوران الأرض حول محورها</span>
            </div>
            🌅
        </button>

        <button class="mode-btn interactive" onclick="setMode('seasons', this)">
            <div class="btn-text">
                <strong>الفصول الأربعة (Seasons)</strong>
                <span>الميل المحوري والدوران المداري</span>
            </div>
            🍃
        </button>

        <button class="mode-btn interactive" onclick="setMode('orbits', this)">
            <div class="btn-text">
                <strong>مقارنة المدارات (Speeds)</strong>
                <span>قوانين كبلر والسرعات المدارية</span>
            </div>
            📈
        </button>
    </div>

    <!-- Bottom Control Bar -->
    <div id="bottom-bar" class="ui-layer interactive">
        <div class="control-group">
            <button class="ctrl-btn" onclick="togglePlayPause()" id="pause-btn">⏸️</button>
            <button class="ctrl-btn" onclick="resetSim()">🔄</button>
            <button class="ctrl-btn active" onclick="setSpeed(1, this)">x1</button>
            <button class="ctrl-btn" onclick="setSpeed(5, this)">x5</button>
            <button class="ctrl-btn" onclick="setSpeed(10, this)">x10</button>
            <button class="ctrl-btn" onclick="setSpeed(50, this)">x50</button>
        </div>

        <div class="control-group">
            <button class="ctrl-btn active" id="toggle-orbits" onclick="toggleOrbits()">المدارات (Orbits)</button>
            <button class="ctrl-btn active" id="toggle-labels" onclick="toggleLabels()">المسميات (Labels)</button>
        </div>
    </div>

    <script>
        // --- 1. Scene & Engine Setup ---
        const container = document.getElementById('canvas-container');
        const labelsContainer = document.getElementById('labels-container');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.002);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 60, 110);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. Lighting ---
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xfff5ea, 2.5, 400);
        scene.add(sunLight);

        // --- 3. Objects Creation ---
        // Sun
        const sunGeo = new THREE.SphereGeometry(7, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffb703 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sun);

        // Sun Glow Layer
        const glowGeo = new THREE.SphereGeometry(7.8, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.25 });
        scene.add(new THREE.Mesh(glowGeo, glowMat));

        // Asteroid Belt Particles
        const asteroidGeo = new THREE.BufferGeometry();
        const asteroidCount = 1200;
        const positions = new Float32Array(asteroidCount * 3);
        for(let i=0; i<asteroidCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 33 + Math.random() * 5;
            positions[i*3] = Math.cos(angle) * dist;
            positions[i*3+1] = (Math.random() - 0.5) * 1.5;
            positions[i*3+2] = Math.sin(angle) * dist;
        }
        asteroidGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const asteroidMat = new THREE.PointsMaterial({ color: 0x6b7280, size: 0.3 });
        scene.add(new THREE.Points(asteroidGeo, asteroidMat));

        // Planets Data
        const planetsData = [
            { name: "عطارد (Mercury)", color: 0x9e9e9e, size: 0.8, dist: 12, speed: 0.04, labelEl: null, mesh: null },
            { name: "الزهرة (Venus)", color: 0xe0a96d, size: 1.3, dist: 18, speed: 0.025, labelEl: null, mesh: null },
            { name: "الأرض (Earth)", color: 0x3b82f6, size: 1.5, dist: 25, speed: 0.015, tilt: 0.41, labelEl: null, mesh: null },
            { name: "المريخ (Mars)", color: 0xef4444, size: 1.0, dist: 31, speed: 0.012, labelEl: null, mesh: null },
            { name: "المشتري (Jupiter)", color: 0xd97706, size: 3.2, dist: 45, speed: 0.006, labelEl: null, mesh: null },
            { name: "زحل (Saturn)", color: 0xf59e0b, size: 2.5, dist: 58, speed: 0.004, labelEl: null, mesh: null }
        ];

        const orbitRings = [];

        // Build Planets & Create Floating 3D Labels
        planetsData.forEach((p) => {
            // Orbit Ring
            const ringGeo = new THREE.RingGeometry(p.dist - 0.08, p.dist + 0.08, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.12 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);
            orbitRings.push(ring);

            // Planet Mesh
            const pGeo = new THREE.SphereGeometry(p.size, 32, 32);
            const pMat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.6 });
            const mesh = new THREE.Mesh(pGeo, pMat);
            if (p.tilt) mesh.rotation.z = p.tilt;
            scene.add(mesh);
            p.mesh = mesh;
            p.angle = Math.random() * Math.PI * 2;

            // HTML Label element
            const label = document.createElement('div');
            label.className = 'planet-label';
            label.innerText = p.name;
            labelsContainer.appendChild(label);
            p.labelEl = label;
        });

        // Sun Label
        const sunLabel = document.createElement('div');
        sunLabel.className = 'planet-label';
        sunLabel.innerText = "الشمس (Sun)";
        labelsContainer.appendChild(sunLabel);

        // --- 4. Simulation Clock & Variables ---
        let isRunning = true;
        let speedMultiplier = 1;
        let totalDays = 1;
        let showLabels = true;
        let currentMode = 'overview';

        // --- 5. Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (isRunning) {
                totalDays += 0.2 * speedMultiplier;
                document.getElementById('day-val').innerText = Math.floor(totalDays % 365) + 1;
                document.getElementById('year-val').innerText = Math.floor(totalDays / 365) + 1;

                // Update Planets Position
                planetsData.forEach((p) => {
                    p.angle += p.speed * 0.2 * speedMultiplier;
                    p.mesh.position.x = Math.cos(p.angle) * p.dist;
                    p.mesh.position.z = Math.sin(p.angle) * p.dist;
                    p.mesh.rotation.y += 0.02 * speedMultiplier;

                    // Update Earth Season readout based on orbit angle
                    if (p.name.includes("Earth")) {
                        updateEarthSeason(p.angle);
                    }
                });

                sun.rotation.y += 0.002;
            }

            // Sync HTML Labels with 3D Coordinates
            updateLabels();

            // Camera Tracking for Modes
            if (currentMode === 'earth' || currentMode === 'daynight') {
                const earth = planetsData[2].mesh;
                controls.target.copy(earth.position);
            } else if (currentMode === 'overview') {
                controls.target.set(0, 0, 0);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Project 3D positions to 2D HTML coordinates
        function updateLabels() {
            const tempV = new THREE.Vector3();

            // Sun Label
            tempV.setFromMatrixPosition(sun.matrixWorld);
            tempV.y += 8;
            projectTo2D(tempV, sunLabel);

            // Planets Labels
            planetsData.forEach((p) => {
                if (!showLabels) {
                    p.labelEl.style.opacity = '0';
                    return;
                }
                tempV.setFromMatrixPosition(p.mesh.matrixWorld);
                tempV.y += p.size + 1.2;
                projectTo2D(tempV, p.labelEl);
            });
        }

        function projectTo2D(vector, element) {
            vector.project(camera);
            if (vector.z > 1) {
                element.style.opacity = '0';
                return;
            }
            const x = (vector.x * .5 + .5) * window.innerWidth;
            const y = (-(vector.y * .5) + .5) * window.innerHeight;
            element.style.transform = `translate(-50%, -100%) translate(${x}px,${y}px)`;
            element.style.opacity = '1';
        }

        function updateEarthSeason(angle) {
            const normAngle = (angle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
            const seasonVal = document.getElementById('season-val');
            
            if (normAngle < Math.PI / 2) {
                seasonVal.innerText = "الصيف (Summer)";
                seasonVal.style.color = "#4ade80";
            } else if (normAngle < Math.PI) {
                seasonVal.innerText = "الخريف (Autumn)";
                seasonVal.style.color = "#f59e0b";
            } else if (normAngle < 3 * Math.PI / 2) {
                seasonVal.innerText = "الشتاء (Winter)";
                seasonVal.style.color = "#60a5fa";
            } else {
                seasonVal.innerText = "الربيع (Spring)";
                seasonVal.style.color = "#f472b6";
            }
        }

        // --- 6. Interactive Controls & Modes ---
        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const earth = planetsData[2].mesh;

            if (mode === 'overview') {
                camera.position.set(0, 60, 110);
            } else if (mode === 'earth') {
                camera.position.set(earth.position.x + 8, 4, earth.position.z + 8);
            } else if (mode === 'daynight') {
                camera.position.set(earth.position.x + 4, 1, earth.position.z + 4);
            } else if (mode === 'seasons') {
                camera.position.set(0, 80, 10);
            } else if (mode === 'orbits') {
                camera.position.set(0, 110, 0);
            }
        }

        function togglePlayPause() {
            isRunning = !isRunning;
            document.getElementById('pause-btn').innerText = isRunning ? "⏸️" : "▶️";
        }

        function setSpeed(spd, btn) {
            speedMultiplier = spd;
            document.querySelectorAll('#bottom-bar .ctrl-btn').forEach(b => {
                if (b.innerText.startsWith('x')) b.classList.remove('active');
            });
            btn.classList.add('active');
        }

        function resetSim() {
            totalDays = 1;
            planetsData.forEach(p => p.angle = 0);
        }

        function toggleOrbits() {
            const btn = document.getElementById('toggle-orbits');
            btn.classList.toggle('active');
            const visible = btn.classList.contains('active');
            orbitRings.forEach(r => r.visible = visible);
        }

        function toggleLabels() {
            const btn = document.getElementById('toggle-labels');
            btn.classList.toggle('active');
            showLabels = btn.classList.contains('active');
            sunLabel.style.display = showLabels ? 'block' : 'none';
        }

        // Window Resize Listener
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize Loop
        animate();
    </script>
</body>
</html>
